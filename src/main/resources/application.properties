# ===================================================
# SafeTrail - Tourist Safety System
# Main Application Configuration
# ===================================================

spring.application.name=tourist-safety-system
server.port=8080

# ===== MYSQL DATABASE CONNECTION =====
spring.datasource.url=jdbc:mysql://localhost:3306/safetrail_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=JAK@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== HIKARI CONNECTION POOL =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===== JWT CONFIG =====
app.jwt.secret=SafeTrailSuperSecretKeyChangeInProductionAtLeast256BitsLong2024
app.jwt.expiration=86400000

# ===== CORS CONFIG =====
app.cors.allowed-origins=http://localhost:3000

# ===== WEBSOCKET CONFIG =====
app.websocket.endpoint=/ws
app.websocket.topic.locations=/topic/locations
app.websocket.topic.alerts=/topic/alerts

# ===== GEOFENCE CHECK =====
app.geofence.check-interval=10000

# ===== LOGGING =====
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE